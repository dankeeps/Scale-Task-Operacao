  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var r = document.documentElement;
        if (t === "special") { r.classList.add("dark", "special", "rail"); }
        else if (t === "pure") { r.classList.add("pure"); }
        else if (t === "light") { r.classList.add("light", "rail"); }
        else { r.classList.add("dark"); }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
